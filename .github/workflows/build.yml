name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/.theos
  LDID_VERSION: v2.1.5-procursus7

jobs:
  build:
    # Theos на Linux собирает iOS-твики тем же clang, что и на macOS:
    # нужны ldid, dpkg-deb и fakeroot. ubuntu-раннеры доступнее и дешевле macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: .theos
          key: theos-${{ runner.os }}-v2

      - name: Install Theos
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang dpkg fakeroot make git perl xz-utils file curl ca-certificates
          # В ubuntu-26.04 пакета ldid нет — берём готовый бинарник у Procursus
          if ! command -v ldid >/dev/null 2>&1; then
            sudo curl -fsSL -o /usr/local/bin/ldid \
              https://github.com/ProcursusTeam/ldid/releases/download/${LDID_VERSION}/ldid_linux_x86_64
            sudo chmod +x /usr/local/bin/ldid
          fi
          ldid -v 2>&1 | head -n 1 || true
          if [ ! -d "$THEOS/makefiles" ]; then
            git clone --recursive --shallow-submodules --depth 1 \
              https://github.com/theos/theos.git "$THEOS"
          fi
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: bash .github/scripts/install-sdk.sh "$THEOS/sdks"

      - name: Build tweak
        run: make package FINALPACKAGE=1

      - name: Build demo app
        working-directory: DemoApp
        run: make package FINALPACKAGE=1

      - name: Collect packages
        if: always()
        run: |
          mkdir -p out
          cp -v packages/*.deb out/ || true
          cp -v DemoApp/packages/*.deb out/ || true
          ls -lh out || true

      - name: Verify package layout
        if: always()
        run: |
          set -uo pipefail
          mapfile -t debs < <(find out -maxdepth 1 -name '*.deb' 2>/dev/null)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "::warning::ни одного .deb не собрано"
            exit 0
          fi
          for deb in "${debs[@]}"; do
            echo "== $deb"
            dpkg-deb -c "$deb" | head -n 15
          done
          tweak_deb="$(find out -maxdepth 1 -name 'com.example.tweaklab_*' -print -quit)"
          if [ -n "$tweak_deb" ]; then
            if dpkg-deb -c "$tweak_deb" \
                 | grep -q "var/jb/Library/MobileSubstrate/DynamicLibraries/TweakLab.dylib"; then
              echo "rootless layout OK: dylib внутри /var/jb"
            else
              echo "::warning::dylib не найден по пути /var/jb/... — проверьте THEOS_PACKAGE_SCHEME"
            fi
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: out/*.deb
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb
          generate_release_notes: true
